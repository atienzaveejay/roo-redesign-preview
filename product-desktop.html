      off: { ribbon: 'Buy the mat, get the fitted board at our cost', headline: '', side: '', foot: '', end: '' }
    };
    const scar = scarcities[scarcity] ?? scarcities.stock;
    const showStrip = scarcity !== 'off';

    const offers = {
      atcost: {
        price: '$54.99',
        badge: 'BOARD AT COST',
        note: 'Board added at our cost: $10, not $19.99. We make nothing on it.',
        heading: 'Why the board goes in at our cost',
        body: 'So you get the full ROO setup from day one, especially if you are starting out without a board you trust yet. $10 instead of $19.99, which is our cost. We earn nothing on it.'
      },
      free: {
        price: '$44.99',
        badge: 'BOARD INCLUDED FREE',
        note: 'The fitted board is free. Same price as the mat on its own.',
        heading: 'Why the board is free right now',
        body: 'So you get the full ROO setup from day one, especially if you are starting out without a board you trust yet. It is $19.99 on its own. Right now it is free.'
      },
      saving: {
        price: '$54.99',
        badge: 'SAVE $9.99',
        note: 'Save $9.99 when the mat and the board go together.',
        heading: 'Why people take the pair',
        body: 'The full ROO setup in one go, especially if you are starting out without a board you trust yet. $54.99 instead of $64.98.'
      }
    };
    const offer = offers[framing] ?? offers.atcost;

    const cardBase = 'width: 100%; box-sizing: border-box; padding: 16px; border-radius: 12px; display: flex; align-items: center; gap: 14px; cursor: pointer; font-family: Dosis, sans-serif; text-align: left;';
    const on = cardBase + ' border: 2px solid #1F43D8; background: #F3F6FF;';
    const off = cardBase + ' border: 2px solid #E2DED6; background: #FFFFFF;';

    const ringBase = 'width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-sizing: border-box;';
    const ringOn = ringBase + ' border: 2px solid #1F43D8;';
    const ringOff = ringBase + ' border: 2px solid #C9C3B8;';
    const dotBase = 'width: 12px; height: 12px; border-radius: 50%; display: block;';
    const dotOn = dotBase + ' background: #1F43D8;';
    const dotOff = dotBase + ' background: transparent;';

    const boxLineBase = 'display: flex; gap: 9px; font-size: 15px; line-height: 1.4; font-weight: 500; color: #4A463F;';

    const photos = [{src:'assets/71d4d1b5b55c4da983633f45128b3488.jpg',alt:"The ROO silicone mat with its built-in scrap pouch, on white"},{src:'assets/0ed375250352db2160e553152928363a.jpg',alt:"Carrot peels swept off the board into the ROO pouch. Scraps go straight in."},{src:'assets/32ae874e23f983e9a5c68cb2b7946003.jpg',alt:"A home cook prepping at the counter with the ROO pouch over the edge. The counter stays clear."},{src:'assets/ea486be0547a0081e77cd176b99dfb6f.jpg',alt:"ROO mat dimensions: fits any board up to 16 inches, 13.5 by 10 inches overall, pouch 3.25 inches deep"},{src:'assets/48383102b2a4cb70c5ee726285bff111.jpg',alt:"Potato peels filling the 7-cup ROO pouch. A full meal of scraps before you empty it once."},{src:'assets/6e28a35f49b156c9f8ed1a34d46eba7e.jpg',alt:"What's included: one ROO mat and one drawstring bag. Cutting board not included."},{src:'assets/52db53bf85450bc317117dc7d104121f.jpg',alt:"Care in three steps: lift it out, tip it into the bin, rinse"}];
    const img = this.state.img ?? 0;
    const go = (n) => this.setState({ img: (n + photos.length) % photos.length });
    const gallery = photos.map((p, i) => ({
      src: p.src,
      label: 'Show photo ' + (i + 1) + ' of ' + photos.length,
      pick: () => go(i),
      thumbStyle: 'width: 76px; height: 76px; flex-shrink: 0; padding: 0; border-radius: 10px; overflow: hidden; background: #FFFFFF; cursor: pointer; box-sizing: border-box; ' + (i === img ? 'border: 2px solid #1F43D8;' : 'border: 1px solid #E2DED6;'),
      dotStyle: 'width: 8px; height: 8px; border-radius: 50%; display: block; background: ' + (i === img ? '#141312' : '#C9C3B8') + ';'
    }));
    return {
      mainSrc: photos[img].src,
      mainAlt: photos[img].alt,
      gallery: gallery,
      prevImg: () => go(img - 1),
      nextImg: () => go(img + 1),
      bundleSelected: isBundle,
      matSelected: !isBundle,
      pickBundle: () => this.setState({ pick: 'bundle' }),
      pickMat: () => this.setState({ pick: 'mat' }),

      bundleCardStyle: isBundle ? on : off,
      matCardStyle: isBundle ? off : on,
      bundleRingStyle: isBundle ? ringOn : ringOff,
      matRingStyle: isBundle ? ringOff : ringOn,
      bundleDotStyle: isBundle ? dotOn : dotOff,
      matDotStyle: isBundle ? dotOff : dotOn,

      bundlePrice: offer.price,
      bundleNote: offer.note,
      badgeLabel: offer.badge,

      reasonHeading: offer.heading,
      reasonBody: offer.body,

      ribbonText: scar.ribbon,
      stockHeadline: scar.headline,
      stockSide: scar.side,
      stockFoot: scar.foot,
      stockStripStyle: 'display: none;',
      reasonEnd: scar.end,
      reasonEndStyle: showStrip
        ? 'margin-top: 12px; font-size: 16px; line-height: 1.5; font-weight: 700; color: #8A3A12;'
        : 'display: none;',

      ctaLabel: isBundle ? ('Add Mat + Board, ' + offer.price) : 'Add Mat only, $44.99',
      ctaSubLine: isBundle ? 'Board at our cost. $64.98 bought separately.' : 'Adds the mat on its own.',
      ctaSubStyle: isBundle
        ? 'margin-top: 7px; font-size: 13px; font-weight: 600; color: #0F6B4F; text-align: center;'
        : 'margin-top: 7px; font-size: 13px; font-weight: 500; color: #6A645B; text-align: center;',

      galleryCaption: isBundle
        ? 'Photos show the mat. Your selection adds the fitted rubberwood board.'
        : 'Cutting board not included with the mat.',

      boxHeading: 'What turns up in the box',
      boardLineStyle: isBundle ? boxLineBase : boxLineBase + ' opacity: 0.32; text-decoration: line-through;'
    };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
