    <div style="width: 760px;">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #6A645B;">WARRANTY</div>
      <h1 style="margin-top: 8px; font-size: 48px; line-height: 1.05; font-weight: 800; letter-spacing: -0.025em;">ROO Limited Warranty</h1>
      <p style="margin-top: 16px; font-size: 19px; line-height: 1.5; font-weight: 500; color: #4A463F;">We build ROO to last. If it doesn't, we replace it.</p>

      <section style="margin-top: 36px; box-sizing: border-box; padding: 32px 36px; border-radius: 16px; background: #F3F6FF; border: 2px solid #1F43D8;">
        <p style="font-size: 14px; font-weight: 700; letter-spacing: 0.08em; color: #6A645B;">ROO MAT</p>
        <h2 style="margin-top: 6px; font-size: 32px; line-height: 1.1; font-weight: 800;">Limited lifetime warranty</h2>
        <p style="margin-top: 12px; font-size: 17px; line-height: 1.6; font-weight: 500; color: #4A463F;">If your mat fails under normal home use, we replace it free for as long as you own it. This covers every ROO mat, including mats bought before the warranty started.</p>
        <h3 style="margin-top: 24px; font-size: 19px; font-weight: 800;">What is covered</h3>
        <ul style="margin-top: 10px; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 17px; line-height: 1.5; font-weight: 500; color: #4A463F;"><li>The mat tearing, cracking or splitting</li><li>The pouch ripping or losing its shape</li></ul>
        <h3 style="margin-top: 24px; font-size: 19px; font-weight: 800;">What is not covered</h3>
        <ul style="margin-top: 10px; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 17px; line-height: 1.5; font-weight: 500; color: #4A463F;"><li>Cuts from using a knife directly on the mat. ROO goes under a cutting board.</li><li>Heat damage. ROO is not designed for heat, so never use it as a trivet or set hot pots, pans or dishes on it, and keep it away from open flame, stovetops and ovens.</li><li>Staining or discoloration from food</li></ul>
      </section>
      <section style="margin-top: 36px; box-sizing: border-box; padding: 32px 36px; border-radius: 16px; background: #FBFAF9; border: 1px solid #EDEAE4;">
        <p style="font-size: 14px; font-weight: 700; letter-spacing: 0.08em; color: #6A645B;">FITTED BOARD</p>
        <h2 style="margin-top: 6px; font-size: 32px; line-height: 1.1; font-weight: 800;">One-year limited warranty</h2>
        <p style="margin-top: 12px; font-size: 17px; line-height: 1.6; font-weight: 500; color: #4A463F;">If your fitted rubberwood board fails under normal home use within one year of delivery, we replace it free.</p>
        <h3 style="margin-top: 24px; font-size: 19px; font-weight: 800;">What is covered</h3>
        <ul style="margin-top: 10px; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 17px; line-height: 1.5; font-weight: 500; color: #4A463F;"><li>The board cracking or splitting</li></ul>
        <h3 style="margin-top: 24px; font-size: 19px; font-weight: 800;">What is not covered</h3>
        <ul style="margin-top: 10px; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 17px; line-height: 1.5; font-weight: 500; color: #4A463F;"><li>Damage from the dishwasher or from soaking</li><li>Damage from not oiling the wood. Hand wash, air dry and oil it now and then.</li><li>Knife marks and scratches from normal use</li><li>Burns or marks from hot pots and pans</li></ul>
      </section>

      <h2 style="margin-top: 48px; font-size: 24px; font-weight: 800;">Who is covered</h2>
      <p style="margin-top: 10px; font-size: 17px; line-height: 1.6; font-weight: 500; color: #4A463F;">The original buyer of a new ROO product bought from thisisroo.com, whenever they bought it. This warranty is separate from, and on top of, our 30-day money-back guarantee.</p>

      <h2 style="margin-top: 32px; font-size: 24px; font-weight: 800;">What we will do</h2>
      <p style="margin-top: 10px; font-size: 17px; line-height: 1.6; font-weight: 500; color: #4A463F;">Send you a free replacement, with shipping on us. If that product is no longer made, we send a comparable one or refund what you paid.</p>

      <h2 style="margin-top: 32px; font-size: 24px; font-weight: 800;">Never covered, mat or board</h2>
      <ul style="margin-top: 12px; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 17px; line-height: 1.5; font-weight: 500; color: #4A463F;">
        <li>Commercial or restaurant use</li>
        <li>Accidents, misuse, pets, or changes made to the product</li>
        <li>Normal wear that doesn&rsquo;t affect how the product works</li>
      </ul>

      <h2 style="margin-top: 32px; font-size: 24px; font-weight: 800;">How to make a claim</h2>
      <p style="margin-top: 10px; font-size: 17px; line-height: 1.6; font-weight: 500; color: #4A463F;">Email <a href="mailto:support@thisisroo.com" style="font-weight: 700;">support@thisisroo.com</a> with your order number, a photo of the problem and a short note. You won't need to send the product back unless we ask. We reply by email.</p>

      <div style="margin-top: 36px; box-sizing: border-box; padding: 20px 22px; border-radius: 12px; background: #FBFAF9; border: 1px solid #EDEAE4;">
        <p style="font-size: 15px; line-height: 1.6; font-weight: 500; color: #4A463F;">Our responsibility is limited to replacing the product or refunding its purchase price. Some states do not allow the exclusion or limitation of incidental or consequential damages, so this limitation may not apply to you. This warranty gives you specific legal rights, and you may also have other rights which vary from state to state.</p>
