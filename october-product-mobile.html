    const on = cardBase + ' border: 2px solid #1F43D8; background: #F3F6FF;';

    const ringBase = 'width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-sizing: border-box;';
    const dotBase = 'width: 11px; height: 11px; border-radius: 50%; display: block;';

    const qBase = 'min-height: 52px; box-sizing: border-box; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-family: Dosis, sans-serif; color: #141312;';
    const qtyOptions = [1, 2, 3].map((n) => {
      const on = n === 3 ? qty >= 3 : qty === n;
      return {
        label: n === 1 ? '1' : (n === 2 ? '2' : '3+'),
        save: n === 1 ? 'Full price' : ('Save ' + (n === 2 ? s2 : s3) + '%'),
        on: on,
        pick: () => this.setState({ qty: n === 3 ? Math.max(3, qty) : n }),
        style: qBase + (on ? ' border: 2px solid #1F43D8; background: #F3F6FF;' : ' border: 2px solid #E2DED6; background: #FFFFFF;')
      };
    });

    return {
      bundleSelected: isBundle,
      matSelected: !isBundle,
      pickBundle: () => this.setState({ pick: 'bundle' }),
      pickMat: () => this.setState({ pick: 'mat' }),
      bundleCardStyle: isBundle ? on : off,
      matCardStyle: isBundle ? off : on,
      bundleRingStyle: ringBase + (isBundle ? ' border: 2px solid #1F43D8;' : ' border: 2px solid #C9C3B8;'),
      matRingStyle: ringBase + (isBundle ? ' border: 2px solid #C9C3B8;' : ' border: 2px solid #1F43D8;'),

      qty: qty,
      multi: qty >= 3,
      save3: s3,
      qtyDown: () => this.setState({ qty: Math.max(3, qty - 1) }),
      qtyUp: () => this.setState({ qty: Math.min(20, qty + 1) }),
      qtyOptions: qtyOptions,
      groundRange: 'delivers in 2 to 5 days',
      priorityRange: 'delivers in 1 to 3 days',
      ctaLabel: 'Add to cart, $' + total
    };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
